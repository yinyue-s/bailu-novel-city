server:
  port: 8080
  servlet:
    context-path: /

spring:
  web:
    resources:
      static-locations: file:./frontend/public/,classpath:/static/
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:NovelCity}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver

  mybatis:
    mapper-locations: classpath:mapper/*.xml
    type-aliases-package: com.bailu.entity
    configuration:
      map-underscore-to-camel-case: true  # 重要：数据库下划线转驼峰

# JWT配置
jwt:
  secret: ${JWT_SECRET:please-change-this-secret-before-deploy}
  expiration: 86400000
  remember-me-expiration: 2592000000

logging:
  level:
    com.bailu: DEBUG
    com.bailu.mapper: DEBUG  # 查看SQL执行
